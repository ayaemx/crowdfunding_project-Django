version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: crowdfunding_db
      POSTGRES_USER: crowdfunding_user
      POSTGRES_PASSWORD: crowdfunding_pass
    ports:
      - "5433:5432"  # CHANGED: Use 5433 on host, 5432 in container
    networks:
      - crowdfunding_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - crowdfunding_network

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://crowdfunding_user:crowdfunding_pass@db:5432/crowdfunding_db
      - REDIS_URL=redis://redis:6379/1
    networks:
      - crowdfunding_network

volumes:
  postgres_data:

networks:
  crowdfunding_network:
    driver: bridge
